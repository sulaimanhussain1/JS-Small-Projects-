<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallex Effect</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "jost";
        }

        h2{
            font-size: 64px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px 5px #000;
        }

        p{
            font-size: 20px;
            color: white;
        }
        section{
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            background-image: linear-gradient(
                rgba(0,0,0,0.3),
                rgba(0,0,0,0.3)
                ),
            url(./austin-distel-7uoMmzPd2JA-unsplash.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }

        .section2{
            background-image: linear-gradient(
                rgba(0,0,0,0.3),
                rgba(0,0,0,0.3)
                ),
            url(./bruce-mars-8YG31Xn4dSw-unsplash.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }

        
        .section3{
            background-image: linear-gradient(
                rgba(0,0,0,0.3),
                rgba(0,0,0,0.3)
                ),
            url(./luigi-estuye-lucreative-uIH-y7kmaeE-unsplash.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }

        
        .section4{
            background-image: linear-gradient(
                rgba(0,0,0,0.3),
                rgba(0,0,0,0.3)
                ),
            url(./daniele-levis-pelusi-UUjxTEET0c0-unsplash.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    
    <section>
        <div>
            <h2>Sulaiman Hussain</h2>
            <p>Ye Banda Maryam k peeche pagal hai.....</p>
        </div>
    </section>
    
    <section class="section2">
        <div>
            <h2>Samaan Osama</h2>
            <p>Ye Banda Maryam ka aashique hai .....</p>
        </div>
    </section>
    
    <section class="section3">
        <div>
            <h2>Hamza Khan</h2>
            <p>Ye Banda Har Larki ka aashique hai .....</p>
        </div>
    </section>
    
    <section class="section4">
        <div>
            <h2>Hanzalah</h2>
            <p>Ispr research chal rahi hai ye larka hai ya gay.....</p>
        </div>
    </section>

</body>
</html>
