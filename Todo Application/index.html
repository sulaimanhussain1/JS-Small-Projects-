<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color: white;
        font-size: 62.5%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        flex-direction: column;
        margin-top: 100px;
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }

      h1 {
        margin-top: 4.8rem;
        font-size: 3.6rem;
        font-weight: 900;
      }

      li {
        cursor: pointer;
        list-style-type: circle;
        margin: 2rem 0;
        text-transform: capitalize;
        color: black;
        font-weight: 500;
        &:hover {
          color: green;
        }
      }
      input {
        min-width: 32rem;
        font-size: 18px;
        padding: 6px 2px;
        border-radius: 0.6rem;
        margin-right: 1.2rem;
        border: none;
      }

      .main_todo_div {
        width: 36rem;
        display: grid;
        grid-template-columns: 1fr 0.3fr;
        align-items: center;
        font-family: cursive;
        height: auto;
      }

      button {
        height: 5rem;
      }

      p,
      li,
      button {
        font-size: 1.7rem;
        letter-spacing: 0.1rem;
        line-height: 1.6;
      }

      .btn,
      .deleteBtn {
        padding: 0.6rem 2.4rem;
        border-radius: 10rem;
        background-color: blue;
        color: white;
        margin-right: 3.6rem;
        cursor: pointer;
        transition: all 0.4s linear;

        &:hover {
          box-shadow: inset 0 0 0 0.2rem blue;
          background-color: transparent;
          color: blue;
        }
      }

      .deleteBtn {
        background-color: red;

        &:hover {
          box-shadow: inset 0 0 0 0.2rem red;
          background-color: transparent;
          color: red;
        }
      }
    </style>
  </head>
  <body>
    <h1>Todo List</h1>
    <br />
    <form action="">
      <div>
        <input type="text" id="inputValue" placeholder="Type Todo Task ..." />
        <button class="btn">Add Todo</button>
      </div>

      <section class="todo-lists-element"></section>
    </form>

    <script>
      const mainTodoElem = document.querySelector(".todo-lists-element");
      const inputValue = document.getElementById("inputValue");

      const getTodoListFromLocal = () => {
        // return JSON.parse(localStorage.getItem("TodoLists"));
        return JSON.parse(localStorage.getItem("TodoLists"))
      };

      const addTodoListLocalStorage = (localTodoLists) => {
        return localStorage.setItem("TodoLists" , JSON.stringify(localTodoLists))
      };

      let localTodoLists = getTodoListFromLocal() || [];

      const addTodoDynamicElement = (curElem) => {
        const divElement = document.createElement("div");
        divElement.classList.add("main_todo_div");
        divElement.innerHTML = `<li>${curElem}</li> <button class="deleteBtn">Delete</button>`;
        mainTodoElem.append(divElement);
      };

      const addTodoList = (e) => {
        e.preventDefault();
        const todoListValue = inputValue.value.trim();

        inputValue.value = ""

        if (todoListValue != "" && !localTodoLists.includes(todoListValue)) {
          localTodoLists.push(todoListValue);
          localTodoLists = [...new Set(localTodoLists)];
          localStorage.setItem("TodoLists", JSON.stringify(localTodoLists));

          addTodoDynamicElement(todoListValue);
        }else{
            alert("You already add this item in the list or You try to enter the empty string")
        }
      };

      const showTodoList = () => {
        localTodoLists.forEach((element) => {
          addTodoDynamicElement(element);
        });
      };

      showTodoList();

      const removeTodoElem = (e) => {
        const todoToRemove = e.target;
        let todoListContent = todoToRemove.previousElementSibling.innerText ;
        let paraElem = todoToRemove.parentElement;
        console.log(todoListContent)
        
        localTodoLists = localTodoLists.filter((curTodo) => {
            return curTodo != todoListContent;
        });

        addTodoListLocalStorage(localTodoLists)
        paraElem.remove();
        console.log(localTodoLists)

      };

      

      
      mainTodoElem.addEventListener('click' , (e) => {
          e.preventDefault()
          if(e.target.classList.contains('deleteBtn')){
              removeTodoElem(e)
        }
        });

        document.querySelector(".btn").addEventListener("click", (e) => {
          addTodoList(e);
        });
        </script>
  </body>
</html>
