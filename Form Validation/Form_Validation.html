<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(208, 209, 209);
            font-family: cursive;
        }

        .container{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            min-height: 250px;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px 0  black
        }

        h2{
            text-align: center;
            font-size: 20px;
            margin-top: 10px;
            
        }

        form{
            height: 60%;
            /* line-height: 2rem; */
            margin-top: 10px;
            padding: 5px;
        }

        .form-group{
            margin: 10px auto;
            
        }

        label{
            display: block;
            font-size: 16px;
            margin-top: 10px;
        }

        input{
            padding: 5px 10px;
            width: 100%;
        }

        .error{
            color: red;
            font-size: 12px;
            display: none;
        }

        button{
            border: none;
            width: 100%;
            height: 30px;
            padding: 5px 10px;
            background-color: rgb(60, 60, 216);
            color: white;
            margin-top: 10px;
            border-radius: 3px;
            font-size: 16px;
            transition: background 0.3s;

            &:hover{
                background-color:rgb(27, 27, 99) ;
            }
        }

        #resultMessage{
            /* border: 1px solid red; */
            color: green;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            /* display: none; */
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>Email & Password Validator</h2>

        <form autocomplete="off" action="">
            
            <div class="form-group">
                <label for="email">Email : </label>
                <input type="email" id="email" placeholder="Enter Your Email">
                <small class="error" id="emailError"></small>
            </div>
            
            <div class="form-group">
                <label for="password">Password : </label>
                <input type="current-password" id="password" placeholder="Enter Your Password">
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit">Validate</button>

        </form>

        <div id="resultMessage"></div>
    </div>

    <script>
        let email = document.querySelector('#email');
        let password = document.querySelector('#password');
        let form = document.querySelector('form');

        form.addEventListener('submit' , function(e){
              e.preventDefault();

              document.querySelector('#emailError').textContent = ""
              document.querySelector('#passwordError').textContent = ""

              const emailRegex = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-z]{2,}$/;
              const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&^])[A-Za-z\d@$!%*?#&^]{8,}$/;

              let emailans = emailRegex.test(email.value);
              let passwordans = passwordRegex.test(password.value);
              let isValid = true;

              if(!emailans){
                document.querySelector('#emailError').textContent = 'Incorrect Email'
                document.querySelector('#emailError').style.display = 'initial' 
                isValid = false;
              }

              if(!passwordans){
                document.querySelector('#passwordError').textContent = 'Incomplete password'
                document.querySelector('#passwordError').style.display = 'initial' 
                isValid = false;
              }

              if(isValid){
                document.querySelector('#resultMessage').textContent = '✔ Everything Is Correct';
              }
            })

    </script>
</body>
</html>
