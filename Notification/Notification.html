<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Toaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <div class="parent flex flex-col items-start gap-2 p-10"></div>
    

    <script>
        function createToaster(config){
            return function(str){
                let div = document.createElement('div');
                div.textContent = str;
                div.className = `inline-block bg-${config.theme}-500 text-white px-4 py-2 rounded shadow-lg pointer-events-none`;

                document.querySelector('.parent').appendChild(div);

                setTimeout(() => {
                     document.querySelector('.parent').removeChild(div);
                }, config.duration * 1000 );
            }
        }

        let toaster = createToaster({
            positionX: 'right',
            positionY: 'top',
            duration: 5,
            theme: 'blue'
        });

        toaster('Warda : I love you Sulaiman!');
        setTimeout(() => {
            toaster('Sulaiman : I love you too Warda!');
        }, 4000);

    </script>
</body>
</html>
