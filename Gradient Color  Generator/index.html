<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Color Generator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(to right top , 
            #39c915, 
            #1f36e4);
            /* background-image: linear-gradient(to right, yellow,red); */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container{
            display: flex;
            justify-content: space-evenly;
        }

        .btn{
            outline: none;
            border: none;
            padding: 10px 20px;
            box-shadow: 1px 1px 5px 0px gray;
            border-radius: 5px;
            display: inline-block;
        }
        #btn1{
            background-color: blue;
            color: white;
        }
        #btn2{
            background-color: rgb(55, 168, 3);
            color: white;
        }

        h2{
            font-size: 18px;
            font-weight: 600;
            color: rgb(26, 25, 25);
            text-align: center;
            margin-top: 30px;
            word-spacing: 5px;
            letter-spacing: 1px;
        }

        #copycode{
            background-color: rgb(247, 244, 240);
            padding: 10px;
            margin-top: 20px;
            border-left: 10px solid rgb(173, 173, 0);
            width: 400px;
            text-align: center;
            color: rgb(94, 93, 93);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    
    <section>
        <div class="container">
            <button id="btn1" class="btn">#45ad23</button>
            <button id="btn2" class="btn">#a42223</button>
        </div>
        <h2>Copy Your Favourite Color From Here ❤</h2>
        <div id="copycode">
            background-image : linear-gradient(to right , #39c915 , #1f36e4)
        </div>
    </section>

    <script>

        const btn1 = document.getElementById('btn1');
        const btn2 = document.getElementById('btn2');
        let copyDiv = document.querySelector('#copycode')

        let btncode1 = '#39c915'
        let btncode2 = '#1f36e4'

        let hexGenerator = () => {
            let generateCode = '0123456789abcdef'
            let hexCode = '#';
            for(let i=0; i < 6 ; i++){
               hexCode += generateCode[Math.round(Math.random() * 15)]
            }
            return hexCode;
        }

        const handlebtn1 = () => {
            btncode1 = hexGenerator()
            btn1.innerText = btncode1;
            document.body.style.backgroundImage = `linear-gradient(to right , ${btncode1} , ${btncode2}`;
            copyDiv.innerHTML = `background-image : linear-gradient(to right , ${btncode1}, ${btncode2})`

        }

        function handlebtn2(){
            btncode2 = hexGenerator()
            btn2.innerText = btncode2;
            document.body.style.backgroundImage = `linear-gradient(to right , ${btncode1} , ${btncode2}`;
            copyDiv.innerHTML = `background-image : linear-gradient(to right , ${btncode1}, ${btncode2})`
        }


        btn1.addEventListener('click' , handlebtn1)
        btn2.addEventListener('click' , handlebtn2)
        copyDiv.addEventListener('click' , () => {
            navigator.clipboard.writeText(copyDiv.innerText)
            alert('Colour Copied Successfully ✔')
            
        })
    </script>
</body>
</html>
