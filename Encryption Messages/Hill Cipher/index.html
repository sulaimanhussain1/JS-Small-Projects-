<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hill Cipher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h2>🔐 Hill Cipher</h2>

    <input type="text" id="userInput" placeholder="Enter your message" />

    <input type="number" id="k1" placeholder="Key a" />
    <input type="number" id="k2" placeholder="Key b" />
    <input type="number" id="k3" placeholder="Key c" />
    <input type="number" id="k4" placeholder="Key d" />

    <div class="btn-group">
      <button id="encryptBtn">Encrypt 🔒</button>
      <button id="decryptBtn">Decrypt 🔑</button>
      <button id="copyBtn">Copy 📋</button>
    </div>

    <div id="outputBox">
      <h3>Result:</h3>
      <textarea id="output" readonly></textarea>
    </div>
  </div>

  <script src="hill.js"></script>
</body>
</html>
