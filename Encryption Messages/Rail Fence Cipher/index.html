<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rail Fence Cipher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h2>🔐 Rail Fence Cipher</h2>

    <input type="text" id="userInput" placeholder="Enter your message here" />
    <input type="number" id="keyInput" placeholder="Enter key (number of rails)" min="2" />

    <div class="btn-group">
      <button id="encryptBtn">Encrypt 🔒</button>
      <button id="decryptBtn">Decrypt 🔑</button>
      <button id="copyBtn">Copy 📋</button>
    </div>

    <div id="outputBox">
      <h3>Result:</h3>
      <textarea id="output" placeholder="Your encrypted/decrypted message..." readonly></textarea>
    </div>
  </div>

  <script src="railFence.js"></script>
</body>
</html>
