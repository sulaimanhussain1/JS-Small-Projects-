<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Columnar Transposition Cipher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h2>🔐 Columnar Transposition Cipher</h2>

    <textarea id="userInput" placeholder="Enter your message..."></textarea>
    <input type="text" id="keyInput" placeholder="Enter key (e.g. Cat / Dog / etc)" />

    <div class="btn-group">
      <button id="encryptBtn">Encrypt 🔒</button>
      <button id="decryptBtn">Decrypt 🔑</button>
    </div>

    <div id="outputBox">
      <h3>Result:</h3>
      <textarea id="output" placeholder="Created by Sulaiman Hussain" readonly></textarea>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
