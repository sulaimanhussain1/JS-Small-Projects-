<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <style>
           *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html , body{
            width: 100%;
            height: 100%;
        }

        #main{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
        }
        input{
            display: none;
        }
        #btn{
            padding: 12px 22px;
            font-size: 18px;
            font-weight: 700;
            background-color: rgb(45, 206, 144);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color .5s ease-in-out;
            &:hover{
                background-color: rgb(17, 73, 52);
            }
        }
    </style>
</head>
<body>

    <div id="main">
        <input type="file">
        <button id="btn">Upload Now</button>
    </div>
    
    <script>
        let fileinp = document.querySelector("input");
        let btn = document.querySelector("#btn");
        let div = document.querySelector('#main');

        btn.addEventListener("click" , function(){
            fileinp.click();
        })

        fileinp.addEventListener('change' , function(e){
            const fileName = e.target.files[0];
            if(fileName){
                // btn.textContent = fileName.name;
                let p = document.createElement('p');
                div.appendChild(p);
                p.innerText = fileName.name;

            }            
        })

    </script>
</body>
</html>
